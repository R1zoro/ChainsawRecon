[project]
name = "bounty-agent"
version = "0.1.0"
description = "Scope-aware bug bounty triage agent with sandboxed tool execution."
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bounty_agent*"]

[project.scripts]
bounty-agent = "bounty_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
