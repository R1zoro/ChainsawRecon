[project]
name = "bounty-agent"
version = "0.1.0"
description = "Scope-aware bug bounty triage agent with sandboxed tool execution."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bounty_agent*", "chainsaw*"]

[project.scripts]
bounty-agent = "bounty_agent.cli:main"
chainsaw-serve = "chainsaw.api.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
